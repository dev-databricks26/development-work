[EMAIL]
address = [SENDER_EMAIL_ADDRESS]
copy_to = [RECIPIENT_EMAIL_1],[RECIPIENT_EMAIL_2]
password = [APP_SPECIFIC_PASSWORD]
smtp_server = [SMTP_SERVER_URL]
smtp_port = [SMTP_PORT_NUMBER]
